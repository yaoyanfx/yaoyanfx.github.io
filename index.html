<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* video player */
#vp{position:fixed;inset:0;z-index:200;background:rgba(6,4,5,.88);display:grid;place-items:center;padding:16px}
#vp .box{position:relative;width:min(960px,100%);aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#vp.short .box{width:min(400px,90vw);aspect-ratio:9/16;max-height:86vh}
#vp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#vp .x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(12,9,10,.6);color:#fff;font-size:22px;cursor:pointer}
#formMsg{font-size:14px;margin:0}
#formMsg.ok{color:#7ee2a0}#formMsg.err{color:#ff9b8a}
</style>
</head>
<body>
<style>
/* Layout: a dark stage. Short home (thesis + doors), then separate rooms: products (category → list → detail), videos, contact. */
:root{
  color-scheme:dark;
  --bg:#0c090a; --bg2:#151012; --line:#2c2226;
  --fg:#f4ede7; --muted:#a8998f; --ember:#fd9100; --gold:#ffc65a;
  --display:"Big Shoulders Display","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --rail:1180px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
.wrap{max-width:var(--rail);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember)}
.page{padding-block:44px 88px}
.ph{display:grid;gap:10px;margin-bottom:28px;max-width:760px}
.ph h1,.ph h2{font-family:var(--display);font-weight:900;font-size:clamp(36px,5.4vw,60px);line-height:1.02}
.ph h1 small,.ph h2 small{display:block;font-family:var(--body);font-size:.4em;font-weight:700;color:var(--muted);margin-top:8px;letter-spacing:.03em}
.ph p{color:var(--muted)}
.crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin-bottom:18px}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--fg)}
.crumb span::before{content:"/";margin-right:6px;opacity:.5}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:var(--body)}
.btn.primary{background:var(--fg);color:var(--bg)} .btn.primary:hover{background:var(--gold)}
.btn.ghost{border-color:var(--line);color:var(--fg);background:rgba(255,255,255,.02)} .btn.ghost:hover{border-color:var(--muted)}
.btn.on{background:var(--ember);color:#1a0d07}

/* Intro: effects play in front of a velvet curtain, then the curtain drops (kabuki drop) */
#intro{position:fixed;inset:0;z-index:100;overflow:hidden;transition:opacity .9s ease;background:rgba(12,9,10,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#curtainCv{display:none}
#intro.fadeout{opacity:0;pointer-events:none}
#intro.gone{display:none}
#curtainCv{position:absolute;inset:0;width:100%;height:100%}
#introCanvas{position:absolute;inset:0;width:100%;height:100%}
#intro.drop #introCanvas,#intro.drop .mark,#intro.drop #skip{opacity:0;transition:opacity .18s}
.mark{position:absolute;inset:0;display:grid;justify-items:center;align-content:center;gap:22px;pointer-events:none;text-align:center;padding:24px}
.logo{position:relative;width:min(58vw,300px);aspect-ratio:1;opacity:0;transform:scale(.45);filter:blur(14px);transition:opacity .45s,transform .9s cubic-bezier(.2,1.45,.3,1),filter .5s}
#intro.s-logo .logo{opacity:1;transform:none;filter:none}
.logo > *{position:absolute;inset:0}
.logo img{width:100%;height:100%;object-fit:contain}
.logo .rb{-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.logo .rb,.logo .rb-t{transition:opacity .9s ease}
#intro.s-std .logo .rb,#intro.s-std .logo .rb-t{opacity:0}
.logo .txt{display:grid;place-items:center;font-weight:900;font-size:min(30vw,170px);line-height:1;letter-spacing:.02em}
.logo .txt.std span{color:var(--ember)}
.rainbow{background:linear-gradient(90deg,#ff3b3b,#ff8a1f,#ffd51f,#3ee07a,#1fc8ff,#5a6bff,#c04bff,#ff3b8d,#ff3b3b);background-size:300% 100%;animation:spectrum 2s linear infinite}
.rainbow.rb-t{-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes spectrum{to{background-position:300% 0}}
.cname{display:grid;gap:6px;opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
#intro.s-name .cname{opacity:1;transform:none}
.cname b{color:var(--ember);font-weight:900;font-size:clamp(22px,5.4vw,38px);letter-spacing:.32em;padding-left:.32em}
.cname span{font-family:var(--display);font-weight:700;font-size:clamp(12px,2.8vw,17px);letter-spacing:.55em;padding-left:.55em;color:var(--ember)}
#skip{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));background:rgba(12,9,10,.5);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.14em;padding:8px 14px;border-radius:99px;cursor:pointer}
#skip:hover{color:var(--fg);border-color:var(--muted)}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(12,9,10,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand img{height:36px;width:auto;display:block}
.brand img.zh{height:30px}
.brand b{font-weight:900;font-size:22px;letter-spacing:.04em}
.brand b span{color:var(--ember)}
.brand small{font-family:var(--display);font-weight:700;letter-spacing:.22em;font-size:23px;line-height:1;color:var(--ember);transform:translateY(1px)}
.nav ul{display:flex;gap:22px;list-style:none;margin:0 0 0 auto;padding:0}
.nav ul a{text-decoration:none;color:var(--muted);font-size:15px;font-weight:500;padding-block:4px;border-bottom:2px solid transparent;white-space:nowrap}
.nav ul a:hover{color:var(--fg)}
.nav ul a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--ember)}
.qbtn{display:inline-flex;align-items:center;gap:8px;background:var(--ember);color:#1a0d07;font-weight:700;font-size:14px;padding:8px 14px;border-radius:99px;text-decoration:none;white-space:nowrap;flex:none}
.qbtn i{font-style:normal;font-family:var(--mono);background:#1a0d07;color:var(--gold);border-radius:99px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px}
@media (max-width:720px){.nav .wrap{flex-wrap:wrap;height:auto;padding-block:10px 0;gap:8px 10px}.brand img{height:32px}.brand img.zh{height:27px}.brand small{font-size:21px}.qbtn{margin-left:auto}.nav ul{order:3;width:100%;margin:0;justify-content:space-between;gap:4px;border-top:1px solid var(--line);padding-block:2px}.nav ul a{font-size:13.5px;padding-block:7px}.nav ul a small{font-size:8.5px;letter-spacing:.12em}}
@media (max-width:480px){.qbtn .t{display:none}.qbtn{padding:6px 8px}.brand small{font-size:19px}}@media (max-width:340px){.brand small{display:none}}

/* Home */
.hero{position:relative;overflow:hidden}
#heroCanvas{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:60%;background:radial-gradient(60% 100% at 50% 100%,rgba(253,145,0,.18),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:clamp(56px,9vw,110px) 40px;display:grid;gap:22px}
.hero h1{font-weight:900;font-size:clamp(40px,7.2vw,92px);line-height:1.14;letter-spacing:.01em}
.hero h1 .hot{color:var(--ember)}
.hero .tagline{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.9vw,21px);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hero .tagline b{color:var(--fg);font-weight:900}
.hero .lede{max-width:600px;font-size:clamp(15px,1.5vw,17px);color:#cfc2b9}
.hero .lede strong{color:var(--fg)}
.hero .wrap{grid-template-columns:minmax(0,1fr) auto;column-gap:48px}
.hero .wrap > *{grid-column:1}
.kumiko{position:absolute;inset:0;pointer-events:none;opacity:.9;
  background:repeating-linear-gradient(60deg,rgba(253,145,0,.07) 0 1px,transparent 1px 34px),repeating-linear-gradient(-60deg,rgba(253,145,0,.07) 0 1px,transparent 1px 34px),repeating-linear-gradient(0deg,rgba(253,145,0,.05) 0 1px,transparent 1px 29.4px);
  -webkit-mask:radial-gradient(60% 80% at 85% 40%,#000,transparent 75%);mask:radial-gradient(60% 80% at 85% 40%,#000,transparent 75%)}
.wm{position:absolute;left:max(4%,calc(50% - 600px + 180px));top:16px;width:min(40vw,440px);opacity:.09;pointer-events:none}
.tate{grid-column:2!important;grid-row:1 / span 6;align-self:stretch;display:flex;gap:18px;align-items:flex-start;justify-content:flex-end;padding-top:8px}
.tate p{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:14px;line-height:1;color:var(--muted);border-inline:1px solid var(--line);padding:16px 10px;margin:0}
.tate p span.b{color:var(--fg);font-weight:700}

.vlines{display:flex;gap:7px;height:300px;padding-top:4px}
.vlines i{position:relative;width:1px;background:linear-gradient(var(--ember),rgba(253,145,0,0) 92%)}
.vlines i:nth-child(2){height:62%;margin-top:28px;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}
.vlines i:nth-child(3){height:80%;margin-top:60px;opacity:.6}
.vlines i:first-child::before{content:"";position:absolute;top:-4px;left:-3px;width:7px;height:7px;background:var(--ember);transform:rotate(45deg)}
.seal{width:54px;height:54px;border:1.5px solid var(--ember);border-radius:4px;display:grid;place-items:center;transform:rotate(-4deg)}
.seal img{width:34px}
.corner{position:absolute;width:22px;height:22px;border:1px solid var(--ember);opacity:.6;pointer-events:none}
.corner.tl{left:max(16px,env(safe-area-inset-left,0px));top:22px;border-right:0;border-bottom:0}
.corner.br{right:max(16px,env(safe-area-inset-right,0px));bottom:22px;border-left:0;border-top:0}
.rule{display:flex;align-items:center;gap:14px;margin-bottom:16px;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line) 30%,var(--line))}
.rule::after{background:linear-gradient(90deg,var(--line),var(--line) 70%,transparent)}
.rule i{width:7px;height:7px;background:var(--ember);transform:rotate(45deg);flex:none}
@media (max-width:860px){.tate{display:none}.hero .wrap{grid-template-columns:1fr}.wm{width:72vw;left:auto;right:4%;top:24px;opacity:.08}}
.pillars{display:flex;flex-wrap:wrap;gap:0;border-block:1px solid var(--line);max-width:640px}
.pillars span{flex:1 1 180px;padding:12px 16px 12px 0;font-size:13px;color:var(--muted);display:grid}
.pillars span + span{padding-left:16px;border-left:1px solid var(--line)}
.pillars span b{color:var(--fg);font-size:15px;font-weight:700}
.pillars span b::before{content:"";display:inline-block;width:6px;height:6px;background:var(--ember);transform:rotate(45deg) translateY(-3px);margin-right:9px}
@media (max-width:520px){.pillars span + span{padding-left:0;border-left:0;border-top:1px solid var(--line)}}



.doors{position:relative;z-index:1;padding-block:8px 72px}
.doors h2{font-weight:500}
.catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.catgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{position:relative;display:block;text-decoration:none;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg2);transition:border-color .2s,transform .2s}
.cat:hover{border-color:var(--ember);transform:translateY(-2px)}
.cat .fx{aspect-ratio:16/9}
.cat .lab{position:absolute;inset:auto 0 0;padding:14px 16px;display:grid;gap:0;background:linear-gradient(transparent,rgba(12,9,10,.92) 55%)}
.cat .lab b{font-size:20px;font-weight:900;line-height:1.3}
.cat .lab span{font-family:var(--display);letter-spacing:.14em;font-size:13px;color:var(--gold);text-transform:uppercase}
.cat .lab p{font-size:13px;color:var(--muted)}
.cat .n{position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:11px;color:#e6d9cf;background:rgba(12,9,10,.6);border:1px solid rgba(255,255,255,.12);padding:2px 8px;border-radius:99px}
@media (max-width:520px){.cat .lab p{display:none}.cat .lab b{font-size:17px}}
.wide{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
@media (max-width:1000px){.wide{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wide em{display:block;font-style:normal;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ember);margin:2px 0 4px}
.nav ul a{display:grid;justify-items:center;line-height:1.25}
.nav ul a small{font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);opacity:.75}
.nav ul a[aria-current="page"] small{color:var(--ember);opacity:1}
.ph h1 .en-t{display:block;font-family:var(--display);font-weight:700;font-size:.3em;letter-spacing:.34em;text-transform:uppercase;color:var(--ember);margin-top:10px}
/* portfolio */
.pf-year{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;border-top:1px solid var(--line);padding-block:22px}
.pf-year > b{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:var(--ember)}
.pf-list{list-style:none;margin:0;padding:0;display:grid}
.pf-list li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.pf-list li:last-child{border-bottom:0}
.pf-date{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pf-t b{display:block;font-size:17px;font-weight:900}
.pf-t span{font-size:13px;color:var(--muted)}
.pf-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pf-tags i{font-style:normal;font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:#d5c8bf}
.pf-v{font-size:13px;color:var(--gold);text-decoration:none;white-space:nowrap}
@media (max-width:640px){.pf-year{grid-template-columns:1fr;gap:10px}.pf-list li{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}.pf-date{grid-column:1/-1}}
.pf-c{font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted);white-space:nowrap}
.pf-stat{display:flex;align-items:baseline;gap:10px;margin:-6px 0 22px}
.pf-stat b{font-family:var(--display);font-weight:900;font-size:56px;line-height:1;color:var(--fg)}
.pf-stat b small{color:var(--ember);font-size:.6em}
.pf-stat span{color:var(--muted)}
.pf-date{white-space:nowrap}
.pf-empty{border:1px dashed var(--line);border-radius:16px;padding:40px 24px;text-align:center;display:grid;gap:10px;justify-items:center}
.pf-empty b{font-size:20px;font-weight:900}
.pf-empty p{color:var(--muted);max-width:460px}
@media (max-width:760px){.wide{grid-template-columns:1fr}}
.wide a{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--bg2)}
.wide a:hover{border-color:var(--ember)}
.wide b{display:block;font-size:20px;font-weight:900}
.wide span{font-size:13px;color:var(--muted)}
.wide i{font-style:normal;font-family:var(--display);font-weight:900;font-size:30px;color:var(--ember)}
/* LINE + company + join */
.linebtn{display:inline-flex;align-items:center;gap:6px;background:#06c755;color:#fff;border-radius:99px;padding:5px 12px 5px 8px;text-decoration:none;font-weight:700;font-size:13px;vertical-align:middle;white-space:nowrap}
.linebtn:hover{filter:brightness(1.08)}
.linebtn svg{width:18px;height:18px;flex:none}
.coinfo .mono{font-family:var(--mono)}
.coinfo{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.coinfo dt{color:var(--muted)} .coinfo dd{margin:0;min-width:0;overflow-wrap:anywhere}
.coinfo .tbd{color:var(--muted);font-style:italic}
.joinlede{font-size:17px;color:#d9cdc4;max-width:620px;margin-bottom:28px}
.perks{list-style:none;margin:0 0 32px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.perks li{padding:20px 20px 20px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.perks li b{font-size:18px;font-weight:900}
.perks li b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--ember);margin-right:10px;vertical-align:middle;transform:translateY(-2px)}
.perks li span{color:var(--muted);font-size:14px;padding-left:18px}
@media (max-width:860px){.perks{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.perks{grid-template-columns:1fr}}
.joincta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:760px}
@media (max-width:640px){.joincta{grid-template-columns:1fr}}

/* FX boxes */
.fx{position:relative;max-width:100%;background:radial-gradient(120% 90% at 50% 110%,#26140d,#0b0809 70%)}
.fx canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fx .hl{position:absolute;left:14px;bottom:10px;display:flex;align-items:baseline;gap:8px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.fx .hl b{font-family:var(--display);font-weight:900;font-size:38px;line-height:1}
.fx .hl span{font-size:12px;color:#e6d9cf}
.fx .tag{position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#e6d9cf;background:rgba(12,9,10,.6);border:1px solid rgba(255,255,255,.12);padding:3px 8px;border-radius:99px}

/* Category tabs (products) */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:thin}
.tabs a{flex:none;border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:99px;font-size:14px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.tabs a small{font-family:var(--mono);font-size:11px;opacity:.7}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}
.view{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.view button{border:0;background:transparent;color:var(--muted);font-family:var(--body);font-size:13px;padding:6px 14px;border-radius:99px;cursor:pointer}
.view button[aria-pressed="true"]{background:var(--bg2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}

/* Product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:#4a3a3f;transform:translateY(-2px)}
.card .fx{aspect-ratio:16/10;display:block}
.mach-c{position:absolute;right:12px;bottom:10px;height:56%;width:auto;max-width:48%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.65));pointer-events:none}
.fx::after{content:"";position:absolute;left:0;right:0;bottom:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(253,145,0,.22) 20%,rgba(253,145,0,.22) 80%,transparent);pointer-events:none}
.card .fx::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.05);pointer-events:none;z-index:0}
.pstage{background:radial-gradient(70% 60% at 50% 70%,#2a1a14 0%,#120c0d 60%,#0b0809 100%);overflow:hidden}
.pstage::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/100% 40px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 100%;-webkit-mask:radial-gradient(80% 80% at 50% 60%,#000,transparent);mask:radial-gradient(80% 80% at 50% 60%,#000,transparent)}
.pstage::after{content:"";position:absolute;left:6%;right:6%;bottom:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(253,145,0,.45),transparent)}
.pstage .tk{position:absolute;width:16px;height:16px;border:1px solid rgba(253,145,0,.7)}
.pstage .tl{left:14px;top:14px;border-right:0;border-bottom:0}.pstage .tr{right:14px;top:14px;border-left:0;border-bottom:0}
.pstage .bl{left:14px;bottom:14px;border-right:0;border-top:0}.pstage .br{right:14px;bottom:14px;border-left:0;border-top:0}
.mach{position:absolute;left:50%;bottom:20%;height:56%;margin:0;transform:translateX(-50%);z-index:1}
.mach img{height:100%;width:auto;max-width:none;display:block;filter:drop-shadow(0 14px 18px rgba(0,0,0,.7))}
.mach .refl{position:absolute;top:100%;left:0;transform:scaleY(-1);opacity:.16;filter:blur(1px);-webkit-mask:linear-gradient(to top,#000,transparent 45%);mask:linear-gradient(to top,#000,transparent 45%)}
.dim{position:absolute;font-family:var(--mono);font-size:11px;color:var(--ember);white-space:nowrap}
.dim.w{left:0;right:0;top:-24px;height:1px;background:rgba(253,145,0,.6)}
.dim.w::before,.dim.w::after{content:"";position:absolute;top:-5px;width:1px;height:11px;background:rgba(253,145,0,.8)}
.dim.w::before{left:0}.dim.w::after{right:0}
.dim.w b{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-weight:500;background:#120c0d;padding:0 6px}
.dim.h{top:0;bottom:0;right:-26px;width:1px;background:rgba(253,145,0,.6)}
.dim.h::before,.dim.h::after{content:"";position:absolute;left:-5px;width:11px;height:1px;background:rgba(253,145,0,.8)}
.dim.h::before{top:0}.dim.h::after{bottom:0}
.dim.h b{position:absolute;top:50%;left:8px;transform:translateY(-50%);writing-mode:vertical-rl;font-weight:500}
.pcap{position:absolute;left:40px;bottom:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.photo-chip{position:absolute;left:12px;top:12px;width:76px;height:76px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#f1ede9 center/contain no-repeat;background-origin:content-box;padding:5px;display:grid;place-items:center;font-size:9px;color:#8d7f77;text-align:center;line-height:1.2}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody h3{font-size:17px;font-weight:900;line-height:1.35}
.cbody h3 a{text-decoration:none} .cbody h3 a:hover{color:var(--gold)}
.cbody .en{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:15px;color:var(--muted);margin-top:-6px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:13px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-family:var(--mono);font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.actions a,.actions button{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;font-family:var(--body);font-size:13.5px;font-weight:700;padding:9px 10px;border-radius:10px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}
.actions a:hover{border-color:var(--ember);color:var(--gold)}
.actions button.on{background:var(--ember);border-color:var(--ember);color:#1a0d07}

/* Spec table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--bg2)}
td.m{font-family:var(--mono);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--muted);font-family:var(--display);letter-spacing:.04em;font-size:13px}
td a{color:var(--gold)}
tr.grp td{background:#120d0f;font-weight:900;color:var(--gold);font-size:13px;letter-spacing:.06em}

/* Product detail */
.detail{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;align-items:start}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.media{display:grid;gap:10px}
.media .stage{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.media .stage > *{position:absolute;inset:0}
.media .photo{background:#f1ede9 center/contain no-repeat;background-origin:content-box;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;padding:20px}
.media .photo b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.mtabs{display:flex;gap:8px}
.mtabs button{border:1px solid var(--line);background:transparent;color:var(--muted);font-family:var(--body);font-size:13px;padding:6px 14px;border-radius:99px;cursor:pointer}
.mtabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.info{display:grid;gap:18px}
.info h1{font-size:clamp(26px,3.4vw,36px);font-weight:900;line-height:1.25}
.info .en{font-family:var(--display);font-weight:700;letter-spacing:.08em;font-size:18px;color:var(--muted);margin-top:-12px}
.big{display:flex;align-items:baseline;gap:10px;border-block:1px solid var(--line);padding-block:14px}
.big b{font-family:var(--display);font-weight:900;font-size:56px;line-height:1;color:var(--gold)}
.big span{color:var(--muted)}
.info .spec{font-size:14px;gap:8px 18px}
.info .spec dd{font-size:14px}
.info .note{color:#d5c8bf}
.info .acts{display:flex;flex-wrap:wrap;gap:10px}
.related{margin-top:56px}
.related h2{font-size:18px;font-weight:900;margin-bottom:14px}

/* Videos */
.vsec + .vsec{margin-top:56px}
.vsec h2{font-size:24px;font-weight:900;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.vsec h2 small{font-family:var(--display);font-size:14px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;font-weight:700}
.vsec > p{color:var(--muted);margin:6px 0 18px}
.vcard{display:block;text-decoration:none;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg2);transition:border-color .2s}
.vcard:hover{border-color:var(--ember)}
.vcard .fx{aspect-ratio:16/9}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play i{width:56px;height:56px;border-radius:50%;background:rgba(12,9,10,.55);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-size:20px;padding-left:4px;backdrop-filter:blur(4px)}
.vcard:hover .play i{background:var(--ember);color:#1a0d07;border-color:var(--ember)}
.vcard .vb{padding:12px 14px;display:grid;gap:2px}
.vcard .vb b{font-size:15px;font-weight:900}
.vcard .vb span{font-size:12.5px;color:var(--muted)}

/* Contact */
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
.cinfo{display:grid;gap:14px;align-content:start}
.cinfo .co{font-size:15px;color:var(--muted)}
.cinfo .co b{display:block;color:var(--fg);font-size:20px;font-weight:900}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.line div{min-width:0}
.line span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.line b{font-family:var(--mono);font-weight:500;font-size:16px;user-select:all;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:transparent;color:var(--fg);font-family:var(--body);font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.copy:hover{border-color:var(--muted)}
.pill3{display:grid;gap:10px;margin-top:8px;border-top:1px solid var(--line);padding-top:18px}
.pill3 div b{display:block;font-weight:900}
.pill3 div span{font-size:14px;color:var(--muted)}
form{display:grid;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
label{display:grid;gap:6px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 12px;font-family:var(--body);font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--ember);outline:none}
textarea{min-height:96px;resize:vertical}
.picked{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:8px}
.picked .empty{font-size:13px;color:var(--muted)}
.picked .empty a{color:var(--gold)}
.pk{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px;color:var(--fg)}
.pk button{border:0;background:var(--line);color:var(--fg);border-radius:99px;width:20px;height:20px;cursor:pointer;line-height:1}
#out{display:grid;gap:10px;border:1px solid var(--ember);border-radius:12px;padding:16px;background:rgba(255,106,43,.06)}
#out pre{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:13px;color:var(--fg);user-select:all}
#out .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#out .acts p{font-size:13px;color:var(--muted)}

footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:var(--body);font-size:13px}
@media (prefers-reduced-motion:reduce){.rainbow{animation:none}.card,.cat{transition:none}}

const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---- smoke sprites: textured puffs instead of blurry radial gradients ---- */
const SMOKE=(()=>{
  const N=5,S=128, grid=Array.from({length:4096},()=>Math.random());
  const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),
    g=(i,j)=>grid[((i&63)*64+(j&63))&4095]; return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v};
  const sprites=[];
  for(let n=0;n<N;n++){
    const c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d'), im=x.createImageData(S,S), o=n*17.3;
    for(let j=0;j<S;j++)for(let i=0;i<S;i++){
      const nx=i/S*4+o, ny=j/S*4+o*.7;
      let f=vn(nx,ny)*.5+vn(nx*2,ny*2)*.25+vn(nx*4,ny*4)*.15+vn(nx*8,ny*8)*.1;
      const dx=(i-S/2)/(S/2), dy=(j-S/2)/(S/2), d=Math.hypot(dx,dy)+ (f-.5)*.55;
      const m=d>=.92?0:d<=.55?1:1-((d-.55)/.37)**2*(3-2*((d-.55)/.37));
      const a=Math.max(0,Math.min(1,(f-.22)*2.2))*m;
      const lum=170+80*f-30*Math.max(0,dy);  // a little darker underneath -> volume
      const k=(j*S+i)*4; im.data[k]=im.data[k+1]=im.data[k+2]=Math.min(255,lum); im.data[k+3]=a*255;
    }
    x.putImageData(im,0,0); sprites.push(c);
  }
  const cache=new Map();
  function get(col,idx){
    let key=col;
    const m=/hsla?\(([\d.]+),\s*([\d.]+)%,\s*([\d.]+)%/.exec(col);
    if(m) key=`${Math.round(+m[1]/15)*15},${m[2]},${Math.round(+m[3]/4)*4}`;
    let set=cache.get(key);
    if(!set){ set=sprites.map(sp=>{ const c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
        x.drawImage(sp,0,0); if(m){x.globalCompositeOperation='source-atop';x.fillStyle=`hsla(${key.split(',')[0]},${m[2]}%,${key.split(',')[2]}%,.72)`;x.fillRect(0,0,S,S)} return c });
      cache.set(key,set) }
    return set[idx%set.length];
  }
  return {get};
})();

/* shared physics + drawing */
function simulate(ctx,P,dt,t){
  for(let i=P.length-1;i>=0;i--){
    const p=P[i]; p.life+=dt;
    if(p.life>p.max){P.splice(i,1);continue}
    if(p.drag){const d=Math.exp(-p.drag*dt);p.vx*=d;p.vy*=d}
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.flut!=null) p.x+=Math.sin(t*3+p.flut)*.6;
    const f=1-p.life/p.max;
    if(p.k==='sp'){
      ctx.globalCompositeOperation='lighter'; ctx.strokeStyle=p.c; ctx.globalAlpha=Math.min(1,f*1.4); ctx.lineWidth=p.lw||1.3;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03); ctx.stroke();
      if(p.glow){ctx.globalAlpha*=.22;ctx.lineWidth=(p.lw||1.3)*4;ctx.stroke()}
      ctx.globalCompositeOperation='source-over';
    } else if(p.k==='cf'){
      p.r+=p.vr*dt; if(p.vy>0){p.vx*=.98; if(p.fl!=null) p.x+=Math.sin(p.life*4+p.fl)*1.2}
      ctx.globalAlpha=Math.min(1,f*2.5); ctx.fillStyle=p.c;

    } else if(p.k==='st'){
      p.hist.push(p.x,p.y); if(p.hist.length>(p.hl||36)) p.hist.splice(0,2);
      ctx.globalAlpha=Math.min(1,f*2.5); ctx.strokeStyle=p.c; ctx.lineWidth=p.wd; ctx.lineCap='round'; ctx.beginPath();
      for(let j=0;j<p.hist.length;j+=2){const wob=Math.sin(j*.45+t*10+p.ph)*(p.wob||2.5); j?ctx.lineTo(p.hist[j]+wob,p.hist[j+1]):ctx.moveTo(p.hist[j]+wob,p.hist[j+1])}
      ctx.stroke();
    } else if(p.k==='fog'){
      if(p.rot==null){p.rot=rnd(0,6.28);p.vrot=rnd(-.8,.8);p.si=(Math.random()*5)|0;p.ph=rnd(0,6)}
      const u=p.life/p.max, r=p.r0+(p.r1-p.r0)*Math.sqrt(u);
      if(p.turb) p.vx+=Math.sin(t*3+p.ph)*p.turb*p.r1*8*dt;
      p.rot+=p.vrot*dt;

    } else if(p.k==='bb'||p.k==='fb'){
      const x=p.x+Math.sin(t*1.6+p.ph)*6; ctx.globalAlpha=Math.min(1,f*3,p.life*3);
      if(p.k==='fb'){const g=ctx.createRadialGradient(x-p.s*.3,p.y-p.s*.3,1,x,p.y,p.s);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(230,230,240,.35)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,p.y,p.s,0,7);ctx.fill()}
      else{ctx.fillStyle='rgba(255,255,255,.05)';ctx.beginPath();ctx.arc(x,p.y,p.s,0,7);ctx.fill();ctx.strokeStyle='rgba(235,240,245,.75)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,p.y,p.s,0,7);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(x-p.s*.35,p.y-p.s*.35,p.s*.15,0,7);ctx.fill()}
    } else if(p.k==='ln'){

function Stage(canvas,kinds){

  st.resize(); return st;
}
function step(st,dt){
  if(!st.w){st.resize(); if(!st.w) return}
  st.t+=dt; spawn(st,dt);
  const {ctx,w,h}=st; ctx.clearRect(0,0,w,h);
  if(st.kinds.includes('kabuki')){ // curtain hangs, drops, then rehangs
    const cyc=st.t%3.4, top=cyc<1.6?0:Math.min(h*1.2,.5*h*9*(cyc-1.6)**2), x0=w*.12, x1=w*.88;
    ctx.fillStyle='rgba(200,200,210,.5)'; ctx.fillRect(x0-6,8,x1-x0+12,3);
    for(let k=0;k<6;k++){const cx=x0+(x1-x0)*k/5; ctx.fillStyle='#8a8f98'; ctx.fillRect(cx-3,6,6,8)}
    if(top<h){ const P=Math.max(10,(x1-x0)/14);
      for(let x=x0;x<x1;x+=2){ const sh=.5+.5*Math.cos(2*Math.PI*(x-x0)/P), wob=cyc<1.6?0:Math.sin(x*.08+cyc*20)*4;
        ctx.fillStyle=`rgb(${(90+90*sh)|0},${(20+22*sh)|0},${(24+18*sh)|0})`; ctx.fillRect(x,14+top+wob,2.4,h-14-top-wob) } }
  }
  if(st.kinds.includes('torch')){ctx.fillStyle='#3a2a22';ctx.fillRect(w/2-3,h*.72,6,h*.28);ctx.fillStyle='#6b5040';ctx.fillRect(w/2-8,h*.7,16,6)}
  simulate(ctx,st.parts,dt,st.t);
  if(st.parts.length>1400) st.parts.splice(0,st.parts.length-1400);
}
const stages=new Map(); let looping=false;
function loop(now){
  let any=false;
  stages.forEach(st=>{ if(!st.running) return; any=true; const dt=Math.min(.05,(now-(st.last||now))/1000); st.last=now; step(st,dt) });
  if(any) requestAnimationFrame(loop); else looping=false;
}
const kick=()=>{ if(!looping){looping=true;requestAnimationFrame(loop)} };
const io=new IntersectionObserver(es=>es.forEach(e=>{
  const st=stages.get(e.target); if(!st) return;
  if(RM){ if(e.isIntersecting&&!st.done){for(let i=0;i<120;i++)step(st,1/60);st.done=true} return }
  st.running=e.isIntersecting; st.last=0; if(st.running) kick();
}),{rootMargin:'80px'});
function mountAll(root){
  root.querySelectorAll('[data-fx]').forEach(el=>{
    const st=Stage(el.querySelector('canvas'),el.dataset.fx.split(','));
    stages.set(el,st); io.observe(el); for(let i=0;i<70;i++) step(st,1/60);
  });
}
function unmountAll(){ stages.forEach((st,el)=>io.unobserve(el)); stages.clear() }
addEventListener('resize',()=>stages.forEach(st=>st.resize()));

function route(){
  const h=(location.hash||'#home').slice(1);

  if(h==='products'){html=vProducts(null);nav='products'}
  else if(h.startsWith('cat-')&&CAT[h.slice(4)]){html=vProducts(h.slice(4));nav='products'}
  else if(h.startsWith('p-')&&ITEMS[+h.slice(2)]){html=vDetail(ITEMS[+h.slice(2)]);nav='products'}
  else if(h==='videos'){html=vVideos();nav='videos'}
  else if(h==='contact'){html=vContact();nav='contact'}
  else if(h==='join'){html=vJoin();nav='join'}
  else if(h==='portfolio'){html=vPortfolio();nav='portfolio'}
  else html=vHome();
  saveDraft(); unmountAll(); stopHero();
  view.innerHTML=html;
  document.querySelectorAll('[data-nav]').forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current') });
  mountAll(view);
  if(document.getElementById('heroCanvas')) startHero();
  if(document.getElementById('qform')) initForm();
  scrollTo(0,0);
}

async function copyText(text,btn){
  const old=btn.textContent;

  catch(_){const tgt=btn.closest('.line')?.querySelector('b')||document.getElementById('outText'); if(tgt){const r=document.createRange();r.selectNodeContents(tgt);const s=getSelection();s.removeAllRanges();s.addRange(r)} btn.textContent='已選取，請手動複製'}
  setTimeout(()=>btn.textContent=old,1800);
}

/* ================= Hero embers ================= */
let heroRun=false;
function stopHero(){heroRun=false}
function startHero(){
  const cv=document.getElementById('heroCanvas'), ctx=cv.getContext('2d'); let w,h,E=[],last=0;
  const rs=()=>{const r=cv.getBoundingClientRect();w=r.width;h=r.height;cv.width=w*DPR;cv.height=h*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}; rs();
  const add=()=>E.push({x:rnd(0,w),y:h+10,vy:rnd(18,60),vx:rnd(-8,8),s:rnd(.6,2.2),l:0,m:rnd(5,11),ph:rnd(0,6)});
  for(let i=0;i<70;i++){add();E[i].y=rnd(0,h);E[i].l=rnd(0,4)}
  const draw=()=>{ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='lighter';
    for(const e of E){const a=Math.sin(Math.PI*e.l/e.m);ctx.fillStyle=`rgba(255,${150+((e.s*40)|0)},70,${.75*a})`;ctx.beginPath();ctx.arc(e.x+Math.sin(e.l*2+e.ph)*6,e.y,e.s,0,7);ctx.fill()}
    ctx.globalCompositeOperation='source-over'};
  draw(); if(RM) return; heroRun=true;
  const f=now=>{ if(!heroRun||!cv.isConnected) return; const dt=Math.min(.05,(now-(last||now))/1000); last=now;
    if(cv.width!==Math.round(cv.getBoundingClientRect().width*DPR)) rs();
    if(E.length<110&&Math.random()<.6) add();
    E=E.filter(e=>(e.l+=dt)<e.m&&e.y>-10); for(const e of E){e.y-=e.vy*dt;e.x+=e.vx*dt}
    draw(); requestAnimationFrame(f)};
  requestAnimationFrame(f);
}

/* ================= Intro: confetti → sparks → fog jets → logo → name → curtain drop ================= */
const intro=document.getElementById('intro'), icv=document.getElementById('introCanvas'), ictx=icv.getContext('2d');
let IP=[], iw, ih, iRun=false, timers=[], it0=0, ilast=0;
(function buildMark(){
  const l=document.getElementById('logoMark');
  if(LOGO) l.innerHTML=`<img src="${LOGO}" alt="曜炎 logo"><div class="rb rainbow" style="--m:url('${LOGO}')"></div>`;

  if(LOGO_TC) document.getElementById('brand').innerHTML=`<img src="${LOGO_TC}" alt=""><img class="zh" src="${LOGO_ZH}" alt="曜炎"><small>YAOYAN</small>`;
})();
const ccv=document.getElementById('curtainCv'), cctx=ccv.getContext('2d'); let dropAt=0;
function irs(){const r=intro.getBoundingClientRect();iw=r.width;ih=r.height;for(const [cv,cx] of [[icv,ictx],[ccv,cctx]]){cv.width=iw*DPR;cv.height=ih*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}}
const NZ=Array.from({length:512},()=>Math.random());
const noise1=x=>{const i=Math.floor(x),f=x-i,a=NZ[i&511],b=NZ[(i+1)&511];return a+(b-a)*f*f*(3-2*f)};
const clamp01=v=>v<0?0:v>.999?.999:v;
/* velvet curtain: vertical folds; on drop the top edge falls with gravity, wrinkles bunch under it and the cloth piles on the floor */
function drawCurtain(time,d){
  const W=iw,H=ih,c=cctx; c.clearRect(0,0,W,H);
  const P=Math.max(46,W/16), sw=3, g=H*5;
  const col=v=>`rgb(${(9+58*v)|0},${(5+22*v)|0},${(6+12*v)|0})`;
  for(let x=0;x<W;x+=sw){
    const ph=2*Math.PI*x/P+.3*Math.sin(time*.9+x*.004)+noise1(x/90)*2.2;
    let s=.5+.5*Math.cos(ph); s=s*.82+.18*(.5+.5*Math.cos(2.7*ph+1.3));
    s*= .4+.6*Math.exp(-Math.pow((x-W/2)/(W*.55),2));
    if(d==null){ c.fillStyle=col(s); c.fillRect(x,0,sw+.6,H); continue }
    const tt=Math.max(0,d-noise1(x/150)*.14), wob=Math.sin(x*.03+d*16)*8*Math.min(1,tt*5);
    const top=.5*g*tt*tt+wob; if(top>=H) continue;
    const span=H-top, pile=Math.min(H*.16,top*.16), wr=Math.min(1,tt*3);
    const gr=c.createLinearGradient(0,top,0,H);
    gr.addColorStop(0,col(Math.min(1,s+.5)));
    gr.addColorStop(clamp01(10/span),col(s*.2));
    for(let k=1;k<=5;k++){const y=(k*(18+wr*8)+noise1(x/45+k*7)*16)/span; gr.addColorStop(clamp01(y),col(Math.min(1,s*(k%2?1.25:.35)+(k%2?.15*wr:0))))}
    gr.addColorStop(clamp01(1-pile/span),col(s));
    if(pile>3){gr.addColorStop(clamp01(1-pile*.7/span),col(Math.min(1,s+.45)));gr.addColorStop(clamp01(1-pile*.35/span),col(s*.25));gr.addColorStop(1,col(Math.min(1,s*.9+.2)))}
    else gr.addColorStop(1,col(s));
    c.fillStyle=gr; c.fillRect(x,top,sw+.6,span);
  }
}
function cannon(x,y,dir,count,power){
  for(let i=0;i<count;i++){
    const ang=dir+rnd(-.2,.2), sp=rnd(1.25,1.75)*ih*power, isSt=Math.random()<.3;
    IP.push(isSt?{k:'st',x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,g:ih*.9,drag:1.5,life:0,max:rnd(3,3.8),c:pick(GOLDSILVER),hist:[],ph:rnd(0,6),wd:rnd(3,4.5),hl:80,wob:6}
                :{k:'cf',x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,g:ih*.75,drag:1.8,life:0,max:rnd(3,4),c:pick(GOLDSILVER),r:rnd(0,6),vr:rnd(-12,12),s:rnd(8,14),fl:rnd(0,6)});
  }
}
function iframe(now){
  if(!iRun) return; const dt=Math.min(.04,(now-(ilast||now))/1000); ilast=now; const t=(now-it0)/1000;
  const narrow=iw<640;
  // 2) sparkler fountains: 1.0s – 2.5s
  if(t>0.05&&t<1.1){
    const xs=narrow?[.15,.5,.85]:[.1,.3,.5,.7,.9], g=ih*1.5;
    xs.forEach(fx=>{ for(let j=0;j<(narrow?380:300)*dt;j++){ const vy=-Math.sqrt(2*g*ih*.82)*rnd(.82,1.04);
      IP.push({k:'sp',x:iw*fx+rnd(-3,3),y:ih-4,vx:rnd(-.05,.05)*ih,vy,g,life:0,max:rnd(1,1.6),c:sparkCol(),lw:narrow?2.6:2.2,glow:1}) } });
  }
  // 3) LED fog jets: 2.3s – 3.6s
  if(false){ // fog jets removed from intro
    const xs=narrow?[.22,.78]:[.2,.5,.8], hue=(t*120)%360, r1=Math.max(iw*(narrow?.2:.1),ih*.09);
    xs.forEach((fx,j)=>{ for(let k=0;k<150*dt;k++) IP.push({k:'fog',x:iw*fx+rnd(-3,3),y:ih,vx:rnd(-.02,.02)*ih,vy:-rnd(1.5,1.8)*ih,g:0,drag:1.3,life:0,max:rnd(1,1.4),r0:r1*.12,r1:r1*rnd(.75,1),col:`hsla(34,100%,${50+j*4}%,`,a:.85,turb:.12}) });
  }
  ictx.clearRect(0,0,iw,ih);
  simulate(ictx,IP,dt,t);
  const d=null; // no curtain: the home page is the backdrop
  if(d!=null&&d>.85){iRun=false;IP=[];intro.classList.add('gone');return}
  requestAnimationFrame(iframe);
}
/* end of intro: the stage fades away to reveal the home page */
function dropCurtain(){
  if(intro.classList.contains('fadeout')) return; timers.forEach(clearTimeout); timers=[];
  if(RM){iRun=false;intro.classList.add('gone');return}
  intro.classList.add('fadeout');
  setTimeout(()=>{iRun=false;IP=[];intro.classList.add('gone')},950);
}
function playIntro(){
  intro.classList.remove('gone','drop','fadeout','s-logo','s-std','s-name'); void intro.offsetWidth; irs(); IP=[]; iRun=true; dropAt=0; drawCurtain(0,null); ilast=0; it0=performance.now();
  if(RM){ intro.classList.add('s-logo','s-std','s-name'); timers.push(setTimeout(dropCurtain,1600)); return }
  requestAnimationFrame(iframe);
  // 1) confetti cannons
  // phones: 2 cannons; desktop: 4 evenly spaced
  const cannons = iw<640 ? [[.25,.1],[.75,-.1]] : [[.125,.16],[.375,.05],[.625,-.05],[.875,-.16]];
  const perCannon = iw<640 ? 30 : 48;
  // confetti removed from intro (sparks → logo → name → curtain drop)
  const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
  at(700,()=>intro.classList.add('s-logo'));   // 4) logo (rainbow)
  at(1150,()=>intro.classList.add('s-std'));    //    back to brand colour
  at(1350,()=>intro.classList.add('s-name'));   // 5) company name
  at(2200,dropCurtain);                         // 6) kabuki drop → home
}
document.getElementById('skip').onclick=e=>{e.stopPropagation();dropCurtain()};
intro.addEventListener('click',dropCurtain);
document.getElementById('replay').onclick=()=>{location.hash='#home';playIntro()};
addEventListener('resize',()=>{ if(iRun) irs() });

  else id=x.searchParams.get('v');
  return id?{src:'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0'}:null } catch(_){ return null } }
